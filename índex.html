<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEAGA SEMI-JOIAS</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f0f2f5;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .app-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 20px;
      color: #1a1a1a;
      margin: 0 0 4px 0;
      letter-spacing: 0.5px;
    }
    .header p {
      font-size: 13px;
      color: #666;
      margin: 0;
      font-weight: 600;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #0056b3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 16px;
      margin-bottom: 12px;
      border-bottom: 2px solid #eef2f5;
      padding-bottom: 4px;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      color: #444;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus {
      border-color: #007bff;
    }
    .result-box {
      background-color: #eef6ff;
      border: 1px solid #b6d4fe;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      text-align: center;
    }
    .result-box p {
      margin: 4px 0;
      font-size: 14px;
      color: #004085;
    }
    .result-box .val-highlight {
      font-size: 18px;
      font-weight: bold;
    }
    .results-final {
      background-color: #1a1a1a;
      color: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
    }
    .results-final .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .results-final .row:last-child {
      margin-bottom: 0;
      padding-top: 8px;
      border-top: 1px solid #333;
    }
    .results-final .label {
      font-size: 14px;
      color: #aaa;
    }
    .results-final .value {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
    }
    .results-final .value-large {
      font-size: 22px;
      font-weight: bold;
      color: #28a745;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>BEAGA SEMI-JOIAS</h1>
      <p>Calculadora de Custo e Atacado</p>
    </div>

    <!-- CONFIGURAÇÕES DO BANHO -->
    <div class="section-title">1. Configuração do Banho</div>
    
    <div class="input-group">
      <label for="mile">Milésimos do banho</label>
      <input type="number" id="mile" step="any" inputmode="decimal" placeholder="Ex: 10" oninput="calcular()">
    </div>

    <div class="input-group">
      <label for="maod">Valor da mão de obra (R$)</label>
      <input type="number" id="maod" step="any" inputmode="decimal" placeholder="Ex: 5" oninput="calcular()">
    </div>

    <div class="input-group">
      <label for="cota">Cotação do Ouro (R$)</label>
      <input type="number" id="cota" step="any" inputmode="decimal" placeholder="Ex: 300" oninput="calcular()">
    </div>

    <div class="result-box">
      <p>Valor por kg: <span class="val-highlight" id="valkg">R$ 0,00</span></p>
      <p style="font-size: 12px; color: #555;">(Valor por grama: <span id="valg">R$ 0,00</span>)</p>
    </div>

    <!-- DADOS DA PEÇA -->
    <div class="section-title">2. Dados da Peça</div>

    <div class="input-group">
      <label for="peso">Peso da peça (gramas)</label>
      <input type="number" id="peso" step="any" inputmode="decimal" placeholder="Ex: 2.5" oninput="calcular()">
    </div>

    <div class="input-group">
      <label for="prec">Preço/Código do Bruto (R$)</label>
      <input type="number" id="prec" step="any" inputmode="decimal" placeholder="Ex: 15" oninput="calcular()">
    </div>

    <!-- RESULTADOS FINAIS -->
    <div class="results-final">
      <div class="row">
        <span class="label">Preço de Custo:</span>
        <span class="value" id="custo">R$ 0,00</span>
      </div>
      <div class="row">
        <span class="label">Preço de ATACADO:</span>
        <span class="value-large" id="final">R$ 0,00</span>
      </div>
    </div>
  </div>

  <script>
    function formatarMoeda(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function calcular() {
      // Entradas Base
      const mile = parseFloat(document.getElementById('mile').value) || 0;
      const maod = parseFloat(document.getElementById('maod').value) || 0;
      const cota = parseFloat(document.getElementById('cota').value) || 0;

      // Cálculos Base
      const soma1 = mile + maod;
      const valkg = soma1 * cota;
      const valg = valkg / 1000;

      // Atualiza interface com valores base
      document.getElementById('valkg').innerText = formatarMoeda(valkg);
      document.getElementById('valg').innerText = formatarMoeda(valg);

      // Entradas da Peça
      const peso = parseFloat(document.getElementById('peso').value) || 0;
      const prec = parseFloat(document.getElementById('prec').value) || 0;

      // Cálculos da Peça
      const mult = valg * peso;
      const custo = mult + prec;
      const atac = custo * 3;
      const final = atac + 2;

      // Atualiza interface com resultados da peça
      document.getElementById('custo').innerText = formatarMoeda(custo);
      document.getElementById('final').innerText = formatarMoeda(final);
    }
  </script>

</body>
</html>
